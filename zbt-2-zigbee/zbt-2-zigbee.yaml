# Home Assistant Connect ZBT-2 - Portable Zigbee firmware (community)
# https://github.com/silenthooligan/ha-connect-portable
#
# This puts the ZBT-2 onto your Wi-Fi network so it can serve Zigbee from
# anywhere instead of being USB-tethered to your Home Assistant host. It's
# the ZBT-2 analogue of esphome/zwa-2 (which already exists for ZWA-2 but
# not yet for ZBT-2 as of April 2026).
#
# Pair with Home Assistant's ZHA integration (HA 2026.5+):
#     Settings -> Devices & Services -> Add Integration -> ZHA
#     Pick the ESPHome serial proxy named "MG24 Zigbee NCP" from the
#     serial-port picker. Or enter the URL manually:
#       esphome-hass://esphome/<esphome_config_entry_id>?port_name=MG24%20Zigbee%20NCP
#
# Pre-2026.5 fallback: legacy-stream-server/zbt-2-zigbee.yaml ships the
# raw-TCP `stream_server` variant for HA versions that lack the
# `esphome-hass://` URL handler.
#
# HARDWARE: Nabu Casa Home Assistant Connect ZBT-2 (EFR32MG24 + ESP32-S3)
#   ESP32-S3 GPIO 14 -> MG24 RX
#   ESP32-S3 GPIO 13 <- MG24 TX
#   ESP32-S3 GPIO  4 -> MG24 RESET (active LOW, open-drain)
#   ESP32-S3 GPIO 10 -> MG24 BTL   (active LOW)
#   UART: 460800 8N1
#
# Pin map source: NabuCasa/zwave-esp-bridge branch puddly/zbt2-final
# (same ESP32-S3 <-> EFR32 wiring as the ZWA-2; only the EFR32 chip differs).
#
# WHY serial_proxy: ESPHome 2026.3.0+ ships first-party `serial_proxy`
# that transports UART bytes inside the encrypted ESPHome native API.
# HA 2026.5+ registers an `esphome-hass://` URI handler in serialx that
# zigpy/bellows can consume. Versus the prior `stream_server` raw-TCP
# pattern, this gives:
#   - noise-protocol encryption on the wire
#   - single listener on :6053 (no separate :6638 plain TCP socket)
#   - first-party component (drops the oxan/esphome-stream-server dep)
#   - same model as the ZWA-2's `zwave_proxy`
#
# Validated end-to-end on HA 2026.5.0b2 + a vendored bellows patch
# (zigpy/bellows#720, gates Python 3.14 + EZSP-over-TCP). Stock bellows
# in HA 2026.5.0b2 is broken on this combo until #720 lands; see the
# top-level README.md "Status & dependencies" section.

esphome:
  name: home-assistant-zbt-2-zigbee
  friendly_name: Home Assistant ZBT-2 (Zigbee)
  min_version: 2026.3.0
  name_add_mac_suffix: true
  project:
    name: silenthooligan.zbt-2-zigbee
    version: "2.0.0"

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "ZBT-2 Zigbee Setup"

captive_portal:

# Encrypted ESPHome native API. ZHA + aioesphomeapi handle the noise
# handshake transparently; serial_proxy rides this transport, no second
# listener needed.
api:
  encryption:
    key: !secret api_encryption_key

logger:
  level: INFO
  baud_rate: 0  # UART is dedicated to the radio

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: mg24_uart
  tx_pin: 14
  rx_pin: 13
  baud_rate: 460800
  rx_buffer_size: 2048

serial_proxy:
  uart_id: mg24_uart
  name: "MG24 Zigbee NCP"
  port_type: TTL

# EFR32 reset + bootloader pins exposed as outputs for OTA / firmware swaps.
output:
  - platform: gpio
    id: mg24_reset
    pin:
      number: 4
      mode:
        output: true
        open_drain: true
      inverted: true
  - platform: gpio
    id: mg24_btl
    pin:
      number: 10
      mode:
        output: true
      inverted: true

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: Reset MG24 Radio
    entity_category: diagnostic
    on_press:
      - output.turn_on: mg24_reset
      - delay: 100ms
      - output.turn_off: mg24_reset

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
